name: Publish beta

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  beta:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install version inference dependency
        run: npm ci --prefix scripts/release-please --ignore-scripts --no-audit --no-fund
      - name: Infer beta version without preparing a stable PR
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-please/Get-BetaVersion.cjs
      - name: Create beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        run: ./scripts/New-BetaRelease.ps1 -CandidateVersion $env:CANDIDATE_VERSION
